{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block body %}
<main class="auth-card">
  <div class="brand brand-center"><span class="brand-mark" aria-hidden="true">N</span> Na Locker</div>
  <h1>Welcome back</h1>
  <p class="muted">Log in to open your personal document locker.</p>
  {% include "_flash.html" %}
  <form method="post" action="{{ url_for('login') }}" class="form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" autocomplete="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>
  <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</main>
{% endblock %}
